<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>小信号 · 交互预览</title>
  <style>
    :root{color-scheme:light;--bg:#f7f7f5;--surface:#fff;--raised:#fcfcfa;--ink:#171717;--muted:#72726e;--quiet:#a4a49f;--line:#e8e8e4;--lav:#d9d2ff;--warm:#ffe0bb;--blue:#d6e6ff;--shadow:0 8px 30px rgba(0,0,0,.04);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;display:grid;place-items:center;padding:28px;background:#eeefed}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #9f93e7;outline-offset:3px}.stage{width:min(100%,390px)}.label{text-align:center;color:#858680;font-size:12px;letter-spacing:.08em;margin:0 0 12px}.phone{height:min(844px,calc(100dvh - 72px));min-height:680px;position:relative;overflow:hidden;border:1px solid rgba(30,30,30,.12);border-radius:34px;background:var(--bg);box-shadow:0 24px 80px rgba(0,0,0,.16)}
    .status{height:48px;padding:13px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:600}.sys{display:flex;gap:7px;font-size:11px;align-items:center}.viewport{position:absolute;inset:48px 0 68px;overflow:hidden}.screen{position:absolute;inset:0;overflow:auto;display:none;padding:12px 20px 28px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.screen.active{display:flex;flex-direction:column}.topline{height:38px;display:flex;align-items:center;justify-content:space-between}.icon-button{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;font-size:21px;cursor:pointer}.icon-button:active,.text-button:active,.nav-button:active{transform:scale(.97);opacity:.75}.page-title{font-size:20px;font-weight:600;text-align:center;flex:1}.partner{display:flex;flex-direction:column;align-items:center;margin-top:12px}.name{font-size:20px;line-height:28px;font-weight:600}.mood-chip{display:flex;gap:8px;align-items:center;min-height:44px;padding:0 12px;border-radius:999px;background:var(--raised);color:var(--muted);font-size:14px;border:0;cursor:pointer}.mood-dot{width:8px;height:8px;border-radius:50%;background:#bfcde5}.home-center{display:flex;flex:1;min-height:310px;flex-direction:column;justify-content:center;align-items:center;padding-bottom:10px}.orb{position:relative;width:160px;height:160px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.visual{position:relative;width:120px;height:120px;display:grid;place-items:center;border-radius:50%;animation:breathe 4s cubic-bezier(.2,0,0,1) infinite;transition:transform 120ms}.orb:active .visual{transform:scale(.93)}.glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--lav),var(--warm) 52%,transparent 76%);opacity:.32;filter:blur(20px)}.middle{width:72px;height:72px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:linear-gradient(135deg,var(--warm),var(--lav) 55%,var(--blue));box-shadow:0 0 32px rgba(217,210,255,.3)}.core{width:24px;height:24px;border-radius:50%;background:#fcfcfa;box-shadow:0 0 12px rgba(255,255,255,.3)}.orb.is-sending .visual{animation:send .8s cubic-bezier(.2,.8,.2,1) both}.wave{position:absolute;width:80px;height:80px;border:1px solid #d9d2ff;border-radius:50%;opacity:0;pointer-events:none}.orb.is-sending .wave:first-child{animation:wave 500ms ease-out 160ms both}.orb.is-sending .wave:nth-child(2){animation:wave 500ms ease-out 280ms both}.prompt{font-size:16px;font-weight:500;margin-top:4px}.hint{font-size:12px;color:var(--quiet);margin-top:8px}.home-note{text-align:center;font-size:14px;color:var(--muted);padding-bottom:8px}.tabbar{position:absolute;bottom:0;left:0;right:0;height:68px;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);background:var(--surface);display:flex}.nav-button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;color:var(--quiet);font-size:12px;cursor:pointer;transition:transform 120ms,opacity 120ms}.nav-button svg{width:20px;height:20px}.nav-button.active{color:var(--ink);font-weight:600}.toast{position:absolute;z-index:10;left:50%;bottom:84px;transform:translate(-50%,12px);padding:10px 16px;border-radius:18px;background:rgba(25,25,25,.88);color:white;font-size:13px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .sheet-backdrop{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .22s}.sheet-backdrop.open{opacity:1;pointer-events:auto}.sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:88%;overflow:auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--surface);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,0,0,1);box-shadow:0 -8px 36px rgba(0,0,0,.08)}.sheet.open{transform:translateY(0)}.handle{width:36px;height:4px;border-radius:4px;background:#d8d8d4;margin:0 auto 18px}.sheet-title{text-align:center;font-size:18px;font-weight:600;margin:4px 0 12px}.sheet-copy{text-align:center;color:var(--muted);font-size:14px;line-height:21px;margin:0 0 18px}.choice-list{border-radius:18px;background:var(--raised);overflow:hidden}.choice,.row-button{width:100%;min-height:50px;padding:0 12px;border:0;border-bottom:1px solid var(--line);background:transparent;display:flex;gap:12px;align-items:center;text-align:left;font-size:15px;cursor:pointer}.choice:last-child,.row-button:last-child{border-bottom:0}.choice-icon{width:28px;text-align:center;font-size:18px}.choice:active,.row-button:active,.capsule:active,.metric-card:active{background:rgba(120,120,110,.07)}.toggle-row{min-height:48px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}.toggle-row input{accent-color:#171717;width:18px;height:18px}.primary,.secondary,.text-button{min-height:48px;border-radius:24px;padding:0 20px;cursor:pointer}.primary{width:100%;border:0;background:var(--ink);color:white;font-size:15px;font-weight:500}.secondary{width:100%;border:1px solid #d8d8d4;background:transparent;color:var(--ink)}.text-button{border:0;background:transparent;color:#666662;width:100%;font-size:14px}.section-heading{font-size:14px;color:var(--muted);font-weight:500;margin:24px 0 12px}.history-head{text-align:center;margin:24px 0 8px;font-size:22px;font-weight:500}.month-control{border:0;background:transparent;color:var(--muted);padding:10px;cursor:pointer;font-size:14px}.starfield{position:relative;flex:1;min-height:330px;margin:8px -4px 12px;border-radius:20px;background:radial-gradient(ellipse at center,rgba(255,255,255,.85),rgba(247,247,245,0) 72%)}.star{position:absolute;width:12px;height:12px;padding:0;border:0;border-radius:50%;background:#91b9ed;box-shadow:0 0 12px rgba(145,185,237,.4);cursor:pointer}.star:nth-child(3n){width:7px;height:7px;background:#d9c1a3}.star:nth-child(4n){background:#384c38}.star:nth-child(5n){background:#618ca2;width:14px;height:14px}.star-caption{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 16px}.timeline-list{display:flex;flex-direction:column;gap:10px}.timeline-item{width:100%;min-height:72px;display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-align:left;cursor:pointer}.timeline-icon{width:36px;height:36px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:18px}.timeline-time{color:var(--quiet);font-size:12px}.timeline-text{font-size:14px;margin-top:3px}.capsule-intro{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 18px}.capsule{width:100%;min-height:114px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);margin:8px 0;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer}.capsule-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#fff5e9;font-size:20px}.capsule-title{font-size:15px;font-weight:500}.capsule-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:19px}.couple{display:flex;align-items:center;justify-content:center;gap:17px;margin:12px 0 6px;font-size:15px}.person-orb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#f2e5d8,#c6c9dc,#d6e6ff);box-shadow:0 0 20px rgba(190,190,220,.2)}.days{text-align:center;font-size:13px;color:var(--muted);margin:4px 0 18px}.metrics{display:flex;gap:12px}.metric-card{flex:1;min-height:108px;border:0;border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer}.metric-symbol{font-size:22px}.metric-label{font-size:12px;color:var(--muted)}.metric-value{font-size:16px}.settings-list{margin-top:18px;border-radius:18px;background:var(--surface);overflow:hidden}.row-button{min-height:52px;justify-content:space-between;padding:0 16px}.chevron{font-size:19px;color:var(--quiet)}.form-field{display:block;margin:12px 0;font-size:14px;color:var(--muted)}.form-field input,.form-field textarea{width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--raised);font:inherit;color:var(--ink)}.form-field textarea{min-height:90px;resize:vertical}.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{min-height:40px;border:1px solid var(--line);border-radius:22px;background:transparent;padding:0 14px;cursor:pointer}.pill.selected{background:#171717;color:#fff;border-color:#171717}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111;--surface:#1a1a1a;--raised:#222;--ink:#f4f4f2;--muted:#a8a8a2;--quiet:#858580;--line:#2e2e2c;--lav:#d6ccff;--warm:#ffe1c2;--blue:#bedaff;--shadow:0 8px 30px rgba(0,0,0,.2)}body{background:#090909}.phone{border-color:#2e2e2c}.primary{background:#f4f4f2;color:#171717}.secondary{border-color:#363634}.middle{border-color:rgba(255,255,255,.16)}.core{background:#222}.starfield{background:radial-gradient(ellipse at center,rgba(40,40,44,.8),rgba(17,17,17,0) 72%)}.pill.selected{background:#f4f4f2;color:#171717;border-color:#f4f4f2}.capsule-icon{background:#302a24}}
    @keyframes breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.035);opacity:1}}@keyframes send{0%,100%{transform:scale(1)}15%{transform:scale(.9)}35%{transform:scale(1.05)}}@keyframes wave{0%{transform:scale(.4);opacity:0}20%{opacity:.5}100%{transform:scale(2);opacity:0}}
    @media(max-width:480px){body{display:block;padding:0;background:var(--bg)}.stage{width:100%}.label{display:none}.phone{height:100dvh;min-height:620px;border:0;border-radius:0;box-shadow:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="stage"><p class="label">小信号 · 交互预览</p>
    <section class="phone" aria-label="小信号交互预览">
      <div class="status"><span>9:41</span><span class="sys"><span>●●●</span><span>◔</span><span>▰</span></span></div>
      <div class="viewport">
        <section class="screen active" id="home" aria-label="信号">
          <div class="topline"><span></span><button class="icon-button" data-action="inbox" aria-label="查看收到的信号">⌁</button></div>
          <div class="partner"><span class="name">姚闻月</span><button class="mood-chip" data-action="mood"><span class="mood-dot"></span><span id="homeMood">今天有点累</span></button></div>
          <div class="home-center"><button class="orb" id="orb" aria-label="轻触选择信号，双击敲一下，长按快速选择"><span class="wave"></span><span class="wave"></span><span class="visual"><span class="glow"></span><span class="middle"><span class="core"></span></span></span></button><span class="prompt">发个信号</span><span class="hint">轻触 · 双击 · 长按都可以</span></div>
          <div class="home-note" id="homeNote">今天留下了 3 个瞬间</div>
        </section>
        <section class="screen" id="history" aria-label="足迹">
          <div class="topline"><span></span><div class="page-title">足迹</div><button class="icon-button" data-action="historyMenu" aria-label="足迹选项">☰</button></div>
          <button class="month-control" data-action="month">September 2026　⌄</button>
          <div class="starfield" id="starfield" aria-label="信号星图"></div>
          <div class="star-caption" id="historyCaption">这个月留下了 46 个点</div>
          <button class="secondary" data-action="timeline">看时间轴　→</button>
        </section>
        <section class="screen" id="us" aria-label="我们">
          <div class="topline"><span></span><div class="page-title">我们</div><button class="icon-button" data-action="settings" aria-label="设置">⚙</button></div>
          <div class="couple"><span class="person-orb"></span><span>王波　×　姚闻月</span><span class="person-orb"></span></div>
          <div class="days">第 184 天</div>
          <div class="metrics"><button class="metric-card" data-action="codes"><span class="metric-symbol">🌻</span><span class="metric-label">我们的暗号</span><span class="metric-value">7</span></button><button class="metric-card" data-action="capsules"><span class="metric-symbol">◌</span><span class="metric-label">时光胶囊</span><span class="metric-value" id="capsuleCount">3</span></button></div>
          <div class="settings-list"><button class="row-button" data-action="notification"><span>通知与勿扰</span><span class="chevron">›</span></button><button class="row-button" data-action="privacy"><span>隐私设置</span><span class="chevron">›</span></button><button class="row-button" data-action="relationship"><span>关系设置</span><span class="chevron">›</span></button><button class="row-button" data-action="about"><span>关于小信号</span><span class="chevron">›</span></button></div>
        </section>
        <section class="screen" id="timeline" aria-label="时间轴">
          <div class="topline"><button class="icon-button" data-action="history">‹</button><div class="page-title">时间轴</div><span class="icon-button"></span></div>
          <div class="section-heading">9 月 24 日</div><div class="timeline-list" id="timelineList"></div>
        </section>
        <section class="screen" id="capsules" aria-label="时光胶囊">
          <div class="topline"><button class="icon-button" data-action="us">‹</button><div class="page-title">时光胶囊</div><button class="icon-button" data-action="createCapsule" aria-label="创建胶囊">＋</button></div>
          <p class="capsule-intro">有些话不用现在打开</p>
          <button class="capsule" data-action="locked"><span class="capsule-icon">🔒</span><span><span class="capsule-title">给姚闻月</span><span class="capsule-sub">7 天后打开<br>2026.10.01</span></span></button>
          <button class="capsule" data-action="opened"><span class="capsule-icon">✦</span><span><span class="capsule-title">已经打开</span><span class="capsule-sub">2026.09.18</span></span></button>
        </section>
        <section class="screen" id="codes" aria-label="我们的暗号">
          <div class="topline"><button class="icon-button" data-action="us">‹</button><div class="page-title">我们的暗号</div><button class="icon-button" data-action="createCode" aria-label="创建暗号">＋</button></div>
          <div class="settings-list"><button class="row-button" data-action="codeDetail"><span>🌻　今天想见你</span><span class="chevron">›</span></button><button class="row-button" data-action="codeDetail"><span>🐱　在干嘛呀</span><span class="chevron">›</span></button><button class="row-button" data-action="codeDetail"><span>🪐　今晚看看天空</span><span class="chevron">›</span></button><button class="row-button" data-action="codeDetail"><span>🍜　记得吃饭</span><span class="chevron">›</span></button></div><p class="capsule-intro">还能创建 3 个</p>
        </section>
        <section class="screen" id="settings" aria-label="通知与勿扰">
          <div class="topline"><button class="icon-button" data-action="us">‹</button><div class="page-title">通知与勿扰</div><span></span></div>
          <div class="settings-list"><label class="row-button"><span>信号通知</span><input type="checkbox" checked></label><label class="row-button"><span>回应通知</span><input type="checkbox" checked></label><label class="row-button"><span>勿扰模式</span><input type="checkbox"></label><button class="row-button" data-action="quietTime"><span>勿扰时间　23:00 — 08:00</span><span class="chevron">›</span></button></div><p class="capsule-intro">勿扰期间，信号仍会保存</p>
        </section>
        <section class="screen" id="mood" aria-label="今天怎么样">
          <div class="topline"><button class="icon-button" data-action="home">‹</button><div class="page-title">今天怎么样</div><span></span></div><div class="settings-list" id="moodList"></div><button class="text-button" data-action="clearMood">今天不设置</button>
        </section>
      </div>
      <nav class="tabbar" aria-label="主导航"><button class="nav-button active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg><span>信号</span></button><button class="nav-button" data-tab="history"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 18 9 13l3 2 6-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="7" r="1.5" fill="currentColor"/></svg><span>足迹</span></button><button class="nav-button" data-tab="us"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><circle cx="17" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 19c.5-3 2.4-4.5 5.5-4.5s5 1.5 5.5 4.5M14.5 15c3.3-.2 5.3 1.1 6 3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>我们</span></button></nav>
      <div class="sheet-backdrop" id="backdrop"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="handle"></div><h2 class="sheet-title" id="sheetTitle"></h2><div id="sheetContent"></div></section><div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const screens=[...document.querySelectorAll('.screen')],nav=[...document.querySelectorAll('.nav-button')],sheet=document.querySelector('#sheet'),backdrop=document.querySelector('#backdrop'),title=document.querySelector('#sheetTitle'),content=document.querySelector('#sheetContent'),toast=document.querySelector('#toast'),orb=document.querySelector('#orb');let toastTimer,tapTimer,selectedSignal='想到你了',noReply=false,monthIndex=0;
    const signals=[['◉','想到你了'],['♡','抱一下'],['☁','今天有点累'],['☀','今天挺开心'],['⌂','到家了'],['☾','晚安'],['··','敲一下'],['＋','瞬间']];
    const showToast=(text)=>{toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)};
    function go(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));nav.forEach(n=>n.classList.toggle('active',n.dataset.tab===id||(id==='timeline'&&n.dataset.tab==='history')||(['capsules','codes','settings','mood'].includes(id)&&n.dataset.tab===(id==='mood'?'home':'us'))));if(id==='history')drawStars();if(id==='timeline')drawTimeline()}
    function openSheet(heading,html){title.textContent=heading;content.innerHTML=html;sheet.classList.add('open');backdrop.classList.add('open')}
    function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open')}
    function sendSignal(label){if(label==='瞬间'||label==='＋ 瞬间'){action('moment');return}selectedSignal=label;closeSheet();orb.classList.remove('is-sending');void orb.offsetWidth;orb.classList.add('is-sending');showToast(`${label} · 信号已经送出`);if(navigator.vibrate)navigator.vibrate(12);setTimeout(()=>orb.classList.remove('is-sending'),850)}
    function picker(){openSheet('发什么？',`<div class="choice-list">${signals.map(([icon,label])=>`<button class="choice" data-send="${label}"><span class="choice-icon">${icon}</span><span>${label}</span></button>`).join('')}</div><label class="toggle-row"><input id="noReply" type="checkbox" ${noReply?'checked':''}>不需要回复</label>`)}
    const moods=[['☀','今天很好'],['⛅','还不错'],['☁','有点累'],['🌧','心情不好'],['☾','想安静一下'],['●','可以找我'],['◐','晚点找我']];
    document.querySelector('#moodList').innerHTML=moods.map(([icon,label])=>`<button class="row-button" data-mood="${label}"><span>${icon}　${label}</span><span class="chevron">›</span></button>`).join('');
    function drawStars(){const box=document.querySelector('#starfield');box.innerHTML='';for(let i=0;i<30;i++){const b=document.createElement('button');b.className='star';b.setAttribute('aria-label','查看一个信号');b.style.left=`${6+(i*37%87)}%`;b.style.top=`${7+(i*53%82)}%`;b.addEventListener('click',()=>detailSheet());box.append(b)}}
    const items=[['23:48','🌙','姚闻月 · 晚安'],['23:49','♡','王波 · 接住了'],['18:21','⌂','王波 · 到家了'],['21:16','☁','姚闻月 · 今天有点累']];
    function drawTimeline(){document.querySelector('#timelineList').innerHTML=items.map(([time,icon,txt])=>`<button class="timeline-item" data-action="detail"><span class="timeline-icon">${icon}</span><span><span class="timeline-time">${time}</span><span class="timeline-text">${txt}</span></span></button>`).join('')}
    function detailSheet(){openSheet('9 月 17 日 · 23:41','<p class="sheet-copy">王波<br>◉ 想到你了<br><br>23:44　姚闻月<br>♡ 接住了</p><button class="secondary" data-action="close">知道了</button>')}
    function action(name){switch(name){case'home':go('home');break;case'history':go('history');break;case'us':go('us');break;case'mood':go('mood');break;case'timeline':go('timeline');break;case'capsules':go('capsules');break;case'codes':go('codes');break;case'settings':case'notification':go('settings');break;case'inbox':openSheet('刚刚想到了你',`<p class="sheet-copy">王波给你留了一个信号<br>01:37</p><button class="primary" data-action="receive">♡　接住了</button><button class="text-button" data-action="reply">◉　我也在</button><button class="text-button" data-action="close">稍后回应</button>`);break;case'receive':closeSheet();showToast('你接住了这个信号');break;case'reply':closeSheet();showToast('我也在 · 已送达');break;case'privacy':openSheet('隐私设置','<p class="sheet-copy">你们留下的信号和照片<br>仅关系双方可见。</p><button class="row-button" data-action="privacyInfo"><span>查看隐私说明</span><span class="chevron">›</span></button>');break;case'relationship':openSheet('关系设置','<p class="sheet-copy">王波 × 姚闻月<br>建立连接于 2026.03.24</p><button class="text-button" data-action="endRelation">解除连接</button>');break;case'endRelation':openSheet('解除连接？','<p class="sheet-copy">解除后，你们将无法继续互发信号。</p><button class="secondary" data-action="close">保留我的记录</button><button class="text-button" data-action="close">取消</button>');break;case'about':openSheet('关于小信号','<p class="sheet-copy">有些时候，不是想聊天。<br>只是突然想到了一个人。</p><button class="secondary" data-action="close">知道了</button>');break;case'moment':openSheet('一个瞬间',`<label class="form-field">选择一张照片<input id="photoFile" type="file" accept="image/*"></label><p id="photoHint" class="capsule-intro">只发送一张照片</p><img id="photoPreview" alt="已选择的照片" hidden style="width:100%;max-height:180px;object-fit:cover;border-radius:16px"><label class="form-field">给它一个信号<input id="momentCaption" maxlength="20" placeholder="想让你也看到。"></label><div class="pill-row"><button class="pill selected" data-expire="永久">永久</button><button class="pill" data-expire="24 小时">24 小时</button><button class="pill" data-expire="查看一次">查看一次</button></div><button class="primary" data-action="sendMoment">发送</button>`);break;case'sendMoment':if(!document.querySelector('#photoFile').files.length){showToast('先选择一张照片');break}closeSheet();showToast('照片信号已经送出');break;case'createCapsule':openSheet('留给以后',`<label class="form-field">写点什么<textarea id="capsuleText" placeholder="留一句话给未来"></textarea></label><label class="form-field">打开时间<input id="unlockDate" type="date" value="2026-10-01"></label><button class="primary" data-action="saveCapsule">封存这个信号</button>`);break;case'saveCapsule':if(!document.querySelector('#capsuleText').value.trim()){showToast('写一句话再封存');break}closeSheet();showToast('已经替你保管好了');break;case'locked':openSheet('还不能打开','<p class="sheet-copy">还有 7 天<br>2026.10.01<br><br>留给那一天再看</p><button class="secondary" data-action="close">知道了</button>');break;case'opened':openSheet('有一个过去的信号','<p class="sheet-copy">不知道你看到这句话时，<br>最近过得怎么样。</p><button class="secondary" data-action="close">合上</button>');break;case'createCode':openSheet('创建暗号',`<label class="form-field">图标<input id="codeIcon" value="🌻"></label><label class="form-field">暗号名称<input id="codeName" placeholder="例如：小太阳"></label><label class="form-field">真正的意思<input id="codeMeaning" placeholder="只有你们懂的含义"></label><button class="primary" data-action="saveCode">创建</button>`);break;case'saveCode':if(!document.querySelector('#codeName').value.trim()||!document.querySelector('#codeMeaning').value.trim()){showToast('请补全暗号名称和含义');break}closeSheet();showToast('暗号已经加入');break;case'codeDetail':openSheet('编辑暗号','<p class="sheet-copy">你们可以修改名称、含义，<br>也可以停用这个暗号。</p><button class="secondary" data-action="close">完成</button>');break;case'quietTime':openSheet('勿扰时间','<label class="form-field">开始时间<input type="time" value="23:00"></label><label class="form-field">结束时间<input type="time" value="08:00"></label><button class="primary" data-action="saveQuiet">保存</button>');break;case'saveQuiet':closeSheet();showToast('勿扰时间已更新');break;case'clearMood':document.querySelector('#homeMood').textContent='今天没有留下状态';go('home');showToast('已清除今天的状态');break;case'month':monthIndex++;document.querySelector('.month-control').textContent=monthIndex%2?'August 2026　⌄':'September 2026　⌄';document.querySelector('#historyCaption').textContent=monthIndex%2?'这个月留下了 38 个点':'这个月留下了 46 个点';break;case'historyMenu':openSheet('足迹','<button class="row-button" data-action="history"><span>信号星图</span><span class="chevron">›</span></button><button class="row-button" data-action="timeline"><span>看时间轴</span><span class="chevron">›</span></button>');break;case'detail':detailSheet();break;case'close':closeSheet();break;case'privacyInfo':openSheet('隐私说明','<p class="sheet-copy">你们的信号、照片和状态仅对关系双方可见。你可以在关系设置中管理连接。</p><button class="secondary" data-action="close">知道了</button>');break;default:showToast('这个入口已打开')}}
    let longPress=false,longPressTimer;orb.addEventListener('pointerdown',()=>{longPress=false;clearTimeout(tapTimer);longPressTimer=setTimeout(()=>{longPress=true;openSheet('快速发个信号',`<div class="choice-list">${signals.slice(0,7).map(([icon,label])=>`<button class="choice" data-send="${label}"><span class="choice-icon">${icon}</span><span>${label}</span></button>`).join('')}</div>`);},560)});orb.addEventListener('pointerup',()=>clearTimeout(longPressTimer));orb.addEventListener('pointercancel',()=>clearTimeout(longPressTimer));orb.addEventListener('click',()=>{if(longPress){longPress=false;return}clearTimeout(tapTimer);tapTimer=setTimeout(picker,230)});orb.addEventListener('dblclick',e=>{e.preventDefault();clearTimeout(tapTimer);clearTimeout(longPressTimer);sendSignal('敲一下')});
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-send],[data-mood],[data-tab],[data-expire]');if(!el)return;if(el.dataset.tab){go(el.dataset.tab);return}if(el.dataset.send){sendSignal(el.dataset.send);return}if(el.dataset.mood){document.querySelector('#homeMood').textContent=el.dataset.mood;go('home');showToast('今天的状态已更新');return}if(el.dataset.expire){document.querySelectorAll('[data-expire]').forEach(p=>p.classList.toggle('selected',p===el));return}if(el.dataset.action)action(el.dataset.action)});
    document.addEventListener('change',e=>{if(e.target.id==='noReply')noReply=e.target.checked;if(e.target.id==='photoFile'&&e.target.files&&e.target.files[0]){const img=document.querySelector('#photoPreview');if(img){img.src=URL.createObjectURL(e.target.files[0]);img.hidden=false;document.querySelector('#photoHint').textContent='已选择一张照片'}}});
    backdrop.addEventListener('click',closeSheet);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});drawStars();drawTimeline();
  </script>
</body>
</html>
